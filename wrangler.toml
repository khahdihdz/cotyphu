name = "co-ty-phu-online"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Phục vụ toàn bộ thư mục public/ (HTML/CSS/JS tĩnh) trực tiếp từ Worker này,
# nên khi import repo vào Cloudflare Dashboard bạn chỉ cần MỘT project duy nhất
# (không cần tạo riêng một dự án Cloudflare Pages).
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
